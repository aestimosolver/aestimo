name: Documentation and packaging
on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'tutorials/**'
      - 'README.md'
      - 'pyproject.toml'
      - 'setup.py'
      - 'MANIFEST.in'
      - '.readthedocs.yaml'
      - '.github/workflows/documentation.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'tutorials/**'
      - 'README.md'
      - 'pyproject.toml'
      - 'setup.py'
      - 'MANIFEST.in'
      - '.readthedocs.yaml'
      - '.github/workflows/documentation.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r docs/requirements.txt build twine
      - run: python -m sphinx -n -W --keep-going -b html docs docs/_build/html
      - run: python -m build
      - run: python -m twine check dist/*
